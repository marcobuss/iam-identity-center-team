type OUAccountsCache
  @model(subscriptions: null, queries: null, mutations: null)
  # Intentionally has no @auth rules. This model exists only so Amplify provisions
  # the cache table (and its TTL); queries, mutations and subscriptions are all null,
  # so no resolvers are generated and there is nothing to authorize. The table is
  # read and written directly via the DynamoDB SDK by teamgetOUAccounts and
  # teaminvalidateOUCache, which receive the table name through CACHE_TABLE_NAME.
  {
  ou_id: ID! @primaryKey
  accounts: AWSJSON
  cached_at: AWSTimestamp
  ttl: AWSTimestamp @ttl
  status: String
}
