AWSTemplateFormatVersion: "2010-09-09"
Description: Management-account organization trail for TEAM CloudWatch audit centralization

Parameters:
  SourceLogGroupName:
    Type: String
    Description: Management-account CloudWatch Logs source group selected by TEAM centralization
    Default: TEAM/CloudTrailManagementEvents
    AllowedPattern: '^[.\-_/#A-Za-z0-9]{1,512}$'

  SourceRetentionDays:
    Type: Number
    Description: Retention for the organization trail CloudWatch Logs source group
    Default: 1
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]

Resources:
  OrganizationTrailSourceLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Ref SourceLogGroupName
      LogGroupClass: STANDARD
      RetentionInDays: !Ref SourceRetentionDays
      DeletionProtectionEnabled: true
      Tags:
        - Key: Application
          Value: TEAM
        - Key: Purpose
          Value: OrganizationTrailSource

  OrganizationTrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: TEAM
        - Key: Purpose
          Value: OrganizationTrailArchive

  OrganizationTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OrganizationTrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudTrailGetBucketAcl
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt OrganizationTrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-trail'
          - Sid: AllowCloudTrailWriteOrganizationLogs
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${OrganizationTrailBucket.Arn}/AWSLogs/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-trail'

  OrganizationTrailCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DeliverOrganizationTrailToSourceLogGroup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${SourceLogGroupName}:log-stream:*'
      Tags:
        - Key: Application
          Value: TEAM
        - Key: Purpose
          Value: OrganizationTrailDelivery

  OrganizationTrail:
    Type: AWS::CloudTrail::Trail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn:
      - OrganizationTrailBucketPolicy
      - OrganizationTrailCloudWatchRole
    Properties:
      TrailName: !Sub '${AWS::StackName}-trail'
      S3BucketName: !Ref OrganizationTrailBucket
      CloudWatchLogsLogGroupArn: !GetAtt OrganizationTrailSourceLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt OrganizationTrailCloudWatchRole.Arn
      EnableLogFileValidation: true
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      IsOrganizationTrail: true
      IsLogging: true
      EventSelectors:
        - IncludeManagementEvents: true
          ReadWriteType: All
      Tags:
        - Key: Application
          Value: TEAM
        - Key: Purpose
          Value: OrganizationTrail

Outputs:
  OrganizationTrailName:
    Description: Management-account multi-Region organization trail name
    Value: !Ref OrganizationTrail

  OrganizationTrailSourceLogGroupName:
    Description: Source log group centralized into the TEAM account
    Value: !Ref OrganizationTrailSourceLogGroup

  OrganizationTrailSourceLogGroupArn:
    Description: Source log group ARN
    Value: !GetAtt OrganizationTrailSourceLogGroup.Arn

  OrganizationTrailBucketName:
    Description: Private S3 archive bucket for organization trail log files
    Value: !Ref OrganizationTrailBucket
